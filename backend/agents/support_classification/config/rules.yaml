# ======================================================================
# MAROCLEAR — Configuration metier v8
# Toute modification metier se fait ICI, sans toucher au code.
# ======================================================================

model:
  provider: openrouter
  name: openai/gpt-oss-120b:free
  fallback: openai/gpt-4.1-nano:free
  temperature: 0.0
  max_tokens: 800
  timeout_seconds: 30
  max_retries: 3
  retry_backoff_seconds: 2

classification:
  certainty_threshold: 0.88
  max_clarification_questions: 3
  valid_classes:
    - INCIDENT
    - DEMANDE
    - "RECLAMATION"
    - AMBIGU

# ======================================================================
# SERVICES PAR TYPE DE TICKET
# ======================================================================

services:
  # -- INCIDENT : chaque service a un systeme et des cas metier --
  incident:
    "1":
      label: "Post-marche-Bourse"
      system: "TCS BaNCS"
      description: "Prise en charge des contrats bourse, ajustement AOE et denouement"
      keywords: ["bourse", "avis d'opere", "aoe", "denouement bourse", "contrat bourse", "marche bourse"]
    "2":
      label: "Post-marche-OTC"
      system: "TCS BaNCS"
      description: "Prise en charge des operations de gre a gre ferme et denouement"
      keywords: ["otc", "gre a gre", "gre-a-gre", "operations otc"]
    "3":
      label: "Post-marche-Repo's"
      system: "TCS BaNCS"
      description: "Prise en charge des pensions livrees et denouement"
      keywords: ["repo", "pension", "pension livree"]
    "4":
      label: "Post-marche-Transfert"
      system: "TCS BaNCS"
      description: "Prise en charge des transferts Franco et denouement"
      keywords: ["transfert", "franco", "transfert franco"]
    "5":
      label: "Referentiel-Titres"
      system: "MyMaroclear"
      description: "Codification, admission, repertoire des valeurs"
      keywords: ["isin", "codification", "admission", "referentiel titre", "instrument", "valeur"]
    "6":
      label: "Referentiel-Affilies"
      system: "MyMaroclear"
      description: "Affiliation, gestion des mandats, repertoire affilies"
      keywords: ["affiliation", "affilie", "mandat", "repertoire affilies"]
    "7":
      label: "OST"
      system: "MyMaroclear"
      description: "Operations sur titres"
      keywords: ["ost", "operation sur titre", "dividende", "detachement"]
    "8":
      label: "Reporting"
      system: "TCS BaNCS"
      description: "Documents comptables fin de journee (RCQ, REQ, RMQ, RSM)"
      keywords: ["rmq", "rsm", "rcq", "req", "reporting", "document comptable", "fin de journee"]
    "9":
      label: "Technique"
      system: "MyMaroclear / TCS"
      description: "Incidents techniques sur interfaces ecrans ou echanges fichiers"
      keywords: ["tcs banks", "tcs bancs", "mymaroclear", "plateforme", "technique", "acces", "connexion",
                 "batch en cours", "lenteur", "page blanche", "erreur 500", "cft", "swift",
                 "indisponible", "inaccessible"]
    "10":
      label: "Autre"
      system: "MyMaroclear / TCS"
      description: "Tout autre incident non liste"
      keywords: []

  # -- RECLAMATION : liste simple (pas de systeme, pas de cas metier) --
  reclamation:
    "R1":
      label: "Releve Comptable"
      keywords: ["releve comptable", "releve", "solde", "position"]
    "R2":
      label: "Denouement des Operations"
      keywords: ["denouement", "suspens", "retard denouement", "non denoue"]
    "R3":
      label: "Operations sur titres (OST)"
      keywords: ["ost", "operation sur titre", "dividende", "detachement", "ecart position"]
    "R4":
      label: "Reporting"
      keywords: ["reporting", "rmq", "rsm", "rcq", "req", "document comptable"]
    "R5":
      label: "Codification et Admission"
      keywords: ["codification", "admission", "isin"]
    "R6":
      label: "Facturation"
      keywords: ["facture", "facturation", "montant", "droit d'admission", "tva", "ice"]
    "R7":
      label: "Acces Plateforme MAROCLEAR"
      keywords: ["acces", "plateforme", "connexion", "mymaroclear"]
    "R8":
      label: "Affiliation"
      keywords: ["affiliation", "affilie", "mandat"]
    "R9":
      label: "Service Bureau (Back-up Affilies)"
      keywords: ["service bureau", "back-up", "backup"]
    "R10":
      label: "Autres"
      keywords: []

  # -- DEMANDE : liste simple --
  demande:
    "D1":
      label: "Information"
      keywords: ["information", "renseignement", "question", "communiquer", "solde",
                 "extraction", "mouvements", "releve", "position", "donnees",
                 "historique", "etat", "situation", "attestation"]
    "D2":
      label: "Assistance"
      keywords: ["assistance", "aide", "accompagnement", "prolonger", "valider", "traitement",
                 "retransmission", "retransmettre", "transmettre", "envoyer", "renvoyer",
                 "mettre a disposition", "generer", "activer", "desactiver"]
    "D3":
      label: "Reinitialisation mot de passe TCS"
      keywords: ["reinitialisation", "mot de passe", "password", "pin", "token", "certificat"]
    "D4":
      label: "Autres"
      keywords: []

