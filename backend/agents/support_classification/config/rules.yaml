# ======================================================================
# QUESTIONS DE CLARIFICATION
# ======================================================================

questions:
  Q1_collectif: >
    Quelle est la nature exacte du probleme : dysfonctionnement technique/blocage,
    fichier metier inexploitable, contenu de facture ou donnee erronee,
    ou simple demande d'action/information ?
  Q2_contenu_type: >
    Ce document ou cette donnee concerne-t-il un flux metier
    (avis d'opere, fichier comptable RSM/RCQ/REQ, flux CFT)
    ou une facture / donnee de facturation ?
  Q3_token_cause: >
    Le token ou certificat a-t-il ete perdu suite a une panne de votre poste,
    ou s'agit-il d'un nouveau materiel (changement de poste prevu) ?
  Q4_action_ou_constat: >
    Souhaitez-vous que nous vous retransmettions ce document,
    ou constatez-vous qu'il est manquant ou errone ?
  Q5_retransmission: >
    Cette demande de retransmission fait-elle suite a une non-reception
    de documents attendus, ou est-ce une demande generique ?
  Q6_suspens_actif: >
    Ce suspens ou retard de denouement est-il toujours en cours en ce moment,
    ou s'agit-il d'un prejudice deja subi ?
  Q7_screenshot: >
    Avez-vous un message d'erreur affiche a l'ecran ?
    Si oui, pouvez-vous joindre une capture d'ecran ?

  triggers:
    Q2_contenu_type: ["rsm", "aoe", "rcq", "req", "rmq", "fichier", "document", "non recu",
                      "non recu", "manquant", "errone", "incomplet", "vide", "corrompu"]
    Q3_token_cause: ["token", "certificat", "rsa"]
    Q4_action_ou_constat: ["retransmission", "retransmettre", "renvoyer", "transmettre",
                           "mettre a disposition", "communiquer"]
    Q5_retransmission: ["retransmission", "retransmettre", "renvoyer"]
    Q6_suspens_actif: ["suspens", "retard", "denouement"]
    Q7_screenshot: ["erreur", "bug", "page blanche", "message d'erreur", "ecran"]
